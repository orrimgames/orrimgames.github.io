<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b3a20">
<title>BRAIN DRAIN</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; width:100%; overflow:hidden; background:#1d2716;
    overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
  body { position:fixed; inset:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .ui { position:absolute; inset:0; pointer-events:none; }

  #top { position:absolute; left:0; right:0; top: calc(env(safe-area-inset-top,0px) + 8px);
         padding:0 12px; opacity:0; transition:opacity .2s; }
  #top.on { opacity:1; }
  #xpbar { height:7px; background:rgba(0,0,0,.42); border-radius:4px; overflow:hidden; border:2px solid #0d1409; }
  #xpfill { height:100%; width:0%; background:linear-gradient(90deg,#7ee06a,#d6ff5e); }
  #row1 { display:flex; justify-content:space-between; align-items:center; margin-top:5px; }
  .chip { font-size:13px; font-weight:900; color:#eafbe0; text-shadow:2px 2px 0 #0d1409; letter-spacing:.6px; }
  #hpwrap { margin-top:5px; height:12px; background:rgba(0,0,0,.42); border:2px solid #0d1409; border-radius:7px; overflow:hidden; }
  #hpfill { height:100%; width:100%; background:linear-gradient(90deg,#ff5d5d,#ff9d5d); transition:width .12s; }
  #wavemsg { position:absolute; left:0; right:0; top:26%; text-align:center; font-size:26px; font-weight:900;
             color:#fff; text-shadow:3px 3px 0 #0d1409; opacity:0; letter-spacing:1px; }
  #wavemsg.go { animation:wpop 1.5s ease-out; }
  @keyframes wpop { 0%{opacity:0;transform:scale(.6)} 15%{opacity:1;transform:scale(1.08)} 75%{opacity:1;transform:scale(1)} 100%{opacity:0} }
  #bossbar { position:absolute; left:12%; right:12%; top: calc(env(safe-area-inset-top,0px) + 72px);
             height:12px; background:rgba(0,0,0,.5); border:2px solid #0d1409; border-radius:7px; display:none; overflow:hidden; }
  #bossfill { height:100%; width:100%; background:linear-gradient(90deg,#b14dff,#ff4d8d); }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:14px; text-align:center; padding: calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 30px);
            opacity:0; pointer-events:none; visibility:hidden;
            transition:opacity .15s, visibility 0s linear .15s; }
  .screen.on { opacity:1; pointer-events:auto; visibility:visible; transition:opacity .15s, visibility 0s; }
  #menu, #over { background:rgba(10,16,8,.74); }
  h1 { font-size:44px; line-height:.95; font-weight:900; color:#b7f06a; text-shadow:4px 4px 0 #0d1409, 0 0 30px rgba(140,255,90,.35);
       letter-spacing:1px; }
  h1 span { color:#ff6b6b; }
  .sub { font-size:14px; line-height:1.6; color:#cfe3c0; max-width:300px; font-weight:600; text-shadow:1px 1px 0 #0d1409; }
  .tap { font-size:12px; font-weight:900; letter-spacing:2.5px; color:#eafbe0; text-transform:uppercase;
         text-shadow:2px 2px 0 #0d1409; animation:blink 1.2s infinite; }
  @keyframes blink { 0%,100%{opacity:.4} 50%{opacity:1} }
  .foot { font-size:11px; color:#8fae7c; letter-spacing:1.2px; font-weight:800; }
  #bigStat { font-size:60px; font-weight:900; color:#fff; text-shadow:4px 4px 0 #0d1409; line-height:1; }
  #overSub { font-size:12px; font-weight:900; letter-spacing:3px; color:#ff8080; text-transform:uppercase; text-shadow:2px 2px 0 #0d1409;}
  #overStats { font-size:13px; font-weight:800; color:#cfe3c0; text-shadow:1px 1px 0 #0d1409; line-height:1.7; }
  #newrec { font-size:14px; font-weight:900; color:#ffe14d; letter-spacing:2px; text-shadow:2px 2px 0 #0d1409; display:none; }

  #lvl { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
         gap:11px; padding:20px; background:rgba(10,16,8,.82); pointer-events:auto; }
  #lvl.on { display:flex; }
  #lvlTitle { font-size:22px; font-weight:900; color:#d6ff5e; text-shadow:3px 3px 0 #0d1409; letter-spacing:1px; }
  .card { width:100%; max-width:330px; background:#2c3a22; border:3px solid #0d1409; border-radius:14px;
          padding:12px 14px; display:flex; align-items:center; gap:12px; text-align:left; box-shadow:0 5px 0 #0d1409; }
  .card:active { transform:translateY(3px); box-shadow:0 2px 0 #0d1409; }
  .cico { width:44px; height:44px; border-radius:11px; background:#0d1409; display:flex; align-items:center; justify-content:center;
          font-size:24px; flex:0 0 auto; }
  .cname { font-size:15px; font-weight:900; color:#eafbe0; }
  .cdesc { font-size:12px; font-weight:600; color:#a7c294; margin-top:2px; line-height:1.35; }
  .clvl { font-size:10px; font-weight:900; color:#ffe14d; letter-spacing:1px; margin-top:3px; }
  #brains { font-size:15px; font-weight:900; color:#ffd23f; text-shadow:2px 2px 0 #0d1409; letter-spacing:.5px; }
  #shop { width:100%; max-width:330px; max-height:38vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
          display:flex; flex-direction:column; gap:7px; }
  .shoprow { display:flex; align-items:center; gap:10px; background:#2c3a22; border:3px solid #0d1409;
             border-radius:12px; padding:8px 11px; text-align:left; }
  .shoprow.maxed { opacity:.55; }
  .shoprow.cant { opacity:.62; }
  .sname { font-size:13px; font-weight:900; color:#eafbe0; }
  .sdesc { font-size:11px; font-weight:600; color:#a7c294; }
  .spips { display:flex; gap:3px; margin-top:3px; }
  .spip { width:12px; height:4px; border-radius:2px; background:rgba(255,255,255,.15); }
  .spip.on { background:#7ee06a; }
  .scost { margin-left:auto; font-size:13px; font-weight:900; color:#ffd23f; white-space:nowrap; }
  .btn { pointer-events:auto; background:#7ee06a; color:#12200c; border:3px solid #0d1409; border-radius:13px;
         padding:12px 30px; font-size:17px; font-weight:900; letter-spacing:1.5px; box-shadow:0 5px 0 #0d1409; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #0d1409; }
  .btn.small { font-size:13px; padding:9px 20px; background:#cfe3c0; }
  #puwrap { position:absolute; left:50%; transform:translateX(-50%);
            top: calc(env(safe-area-inset-top,0px) + 92px); width:60%; display:none; text-align:center; }
  #puname { font-size:12px; font-weight:900; letter-spacing:2px; color:#fff; text-shadow:2px 2px 0 #0d1409; }
  #pubar { height:8px; background:rgba(0,0,0,.45); border:2px solid #0d1409; border-radius:5px; overflow:hidden; margin-top:3px; }
  #pufill { height:100%; width:100%; background:linear-gradient(90deg,#ffd23f,#ff6b6b); }
  #mute { position:absolute; right:12px; bottom: calc(env(safe-area-inset-bottom,0px) + 12px);
          width:40px; height:40px; border-radius:50%; background:rgba(0,0,0,.35); pointer-events:auto;
          display:flex; align-items:center; justify-content:center; font-size:15px; color:#cfe3c0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div id="top">
    <div id="xpbar"><div id="xpfill"></div></div>
    <div id="row1">
      <div class="chip" id="timeC">0:00</div>
      <div class="chip" id="lvlC">LV 1</div>
      <div class="chip" id="killC">0</div>
    </div>
    <div id="hpwrap"><div id="hpfill"></div></div>
  </div>
  <div id="bossbar"><div id="bossfill"></div></div>
  <div id="puwrap"><div id="puname"></div><div id="pubar"><div id="pufill"></div></div></div>
  <div id="wavemsg"></div>

  <div class="screen on" id="menu">
    <h1>BRAIN<span>&nbsp;DRAIN</span></h1>
    <div class="sub">Drag your thumb to run. You auto-shoot.<br>Goo levels you up. Brains buy permanent upgrades.</div>
    <div id="brains">0 BRAINS</div>
    <button class="btn" id="startBtn">PLAY</button>
    <div class="foot" style="margin-top:2px">SPEND YOUR BRAINS</div>
    <div id="shop"></div>
    <div class="foot" id="menuBest"></div>
  </div>

  <div class="screen" id="over">
    <div id="overSub">You got eaten</div>
    <div id="bigStat">0:00</div>
    <div id="newrec">New record!</div>
    <div id="overStats"></div>
    <div id="earned"></div>
    <div class="tap">Tap to run again</div>
    <button class="btn small" id="shopBtn">BRAIN SHOP</button>
  </div>

  <div id="lvl">
    <div id="lvlTitle">LEVEL UP</div>
    <div id="cards"></div>
  </div>
  <div id="mute">&#9834;</div>
</div>
<script>
(function(){
"use strict";
/* ================= canvas ================= */
var cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=true;
}
/* ================= save ================= */
var KEY='braindrain.v1';
var save={bestTime:0,bestKills:0,runs:0,totalKills:0,mute:0,brains:0,meta:{}};
try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); for(var k in o) if(k in save) save[k]=o[k];}}catch(e){}
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(save)); }catch(e){} }

/* ================= audio ================= */
var A={ctx:null,master:null,on:!save.mute,noise:null,last:{}};
function aInit(){
  if(A.ctx){ if(A.ctx.state==='suspended') A.ctx.resume(); return; }
  var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  A.ctx=new AC(); A.master=A.ctx.createGain(); A.master.gain.value=A.on?0.85:0; A.master.connect(A.ctx.destination);
  var n=A.ctx.sampleRate*0.4, b=A.ctx.createBuffer(1,n,A.ctx.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
  A.noise=b;
}
function tone(f,dur,type,vol,bend){
  if(!A.ctx||!A.on) return; var t0=A.ctx.currentTime;
  var o=A.ctx.createOscillator(), g=A.ctx.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
  if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(25,bend),t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.15,t0+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(A.master); o.start(t0); o.stop(t0+dur+0.02);
}
function nz(dur,vol,freq,q,type){
  if(!A.ctx||!A.on||!A.noise) return; var t0=A.ctx.currentTime;
  var s=A.ctx.createBufferSource(); s.buffer=A.noise;
  var f=A.ctx.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq||900; f.Q.value=q||1;
  var g=A.ctx.createGain(); g.gain.setValueAtTime(vol||0.2,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(A.master); s.start(t0); s.stop(t0+dur+0.02);
}
function throttle(k,ms){ var n=performance.now(); if(A.last[k]&&n-A.last[k]<ms) return false; A.last[k]=n; return true; }
var SFX={
  shoot:function(){ if(!throttle('s',45))return; tone(680,0.06,'square',0.07,300); },
  boom:function(){ nz(0.28,0.3,220,0.8,'lowpass'); tone(120,0.3,'sawtooth',0.16,40); },
  hit:function(){ if(!throttle('h',35))return; nz(0.05,0.11,1500,1.4); },
  splat:function(){ if(!throttle('sp',60))return; nz(0.2,0.22,420,0.7,'lowpass'); tone(160,0.12,'sawtooth',0.07,60); },
  groan:function(){ if(!throttle('g',700))return; tone(90+Math.random()*40,0.5,'sawtooth',0.045,60); },
  pickup:function(){ if(!throttle('p',55))return; tone(900+Math.random()*200,0.05,'triangle',0.05,1400); },
  hurt:function(){ tone(220,0.25,'sawtooth',0.2,70); nz(0.16,0.2,600,0.8); },
  levelup:function(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ tone(f,0.22,'triangle',0.16); },i*80); }); },
  boss:function(){ tone(70,1.0,'sawtooth',0.25,38); nz(0.9,0.22,240,0.6,'lowpass'); },
  die:function(){ nz(0.7,0.4,300,0.5,'lowpass'); tone(200,0.8,'sine',0.24,38); },
  zap:function(){ if(!throttle('z',60))return; nz(0.09,0.16,2600,2.5); tone(1400,0.07,'square',0.06,600); },
  swing:function(){ if(!throttle('sw',120))return; nz(0.08,0.09,700,1.6); }
};
function buzz(p){ if(A.on&&navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }

/* ================= sprite cache ================= */
var SPR={};
function mk(w,h,f){ var c=document.createElement('canvas'); c.width=Math.ceil(w); c.height=Math.ceil(h);
  var x=c.getContext('2d'); x.translate(w/2,h/2); f(x); return c; }
var OUT='#16220e';
function zombieSprite(type,frame,flash,flip){
  var key=type+frame+(flash?'f':'')+(flip?'L':'');
  if(SPR[key]) return SPR[key];
  if(flip){ var base=zombieSprite(type,frame,flash,0);
    SPR[key]=mk(base.width,base.height,function(x){ x.scale(-1,1); x.drawImage(base,-base.width/2,-base.height/2); });
    return SPR[key]; }
  var cfg=ZTYPE[type], r=cfg.r, pad=r*1.9;
  SPR[key]=mk(pad*2,pad*2,function(x){
    var body=flash?'#ffffff':cfg.col, dark=flash?'#dddddd':cfg.col2;
    x.fillStyle='rgba(0,0,0,0.20)';
    x.beginPath(); x.ellipse(0, r*1.16, r*0.78, r*0.26, 0,0,6.283); x.fill();
    var lean=(frame===0?-1:1);
    x.lineWidth=Math.max(2.5,r*0.20); x.strokeStyle=OUT; x.lineJoin='round';
    // legs
    x.fillStyle=dark;
    [[-r*0.42,lean],[r*0.42,-lean]].forEach(function(L){
      x.beginPath(); x.ellipse(L[0], r*0.85+L[1]*r*0.10, r*0.26, r*0.34, 0,0,6.283); x.fill(); x.stroke();
    });
    // arms reaching forward
    x.fillStyle=dark;
    [[-r*0.95, -r*0.12+lean*r*0.10],[r*0.95, -r*0.12-lean*r*0.10]].forEach(function(Ar){
      x.beginPath(); x.ellipse(Ar[0],Ar[1], r*0.26, r*0.22, 0,0,6.283); x.fill(); x.stroke();
    });
    // body
    x.fillStyle=body;
    x.beginPath(); x.ellipse(0, r*0.20, r*0.72, r*0.78, 0,0,6.283); x.fill(); x.stroke();
    // shirt rip
    if(!flash){ x.fillStyle=cfg.shirt; x.beginPath(); x.ellipse(0, r*0.46, r*0.66, r*0.42, 0,0,6.283); x.fill(); x.stroke(); }
    // head
    x.fillStyle=body;
    x.beginPath(); x.ellipse(0,-r*0.62, r*0.66, r*0.60, 0,0,6.283); x.fill(); x.stroke();
    if(!flash){
      // eyes
      x.fillStyle='#fff';
      x.beginPath(); x.arc(-r*0.26,-r*0.70, r*0.21,0,6.283); x.fill();
      x.beginPath(); x.arc(r*0.24,-r*0.66, r*0.25,0,6.283); x.fill();
      x.fillStyle='#16220e';
      x.beginPath(); x.arc(-r*0.22,-r*0.68, r*0.10,0,6.283); x.fill();
      x.beginPath(); x.arc(r*0.28,-r*0.63, r*0.12,0,6.283); x.fill();
      // mouth
      x.fillStyle='#4a1220';
      x.beginPath(); x.ellipse(0,-r*0.28, r*0.30, r*0.16, 0,0,6.283); x.fill();
      x.fillStyle='#fff';
      x.fillRect(-r*0.18,-r*0.40, r*0.12, r*0.14);
      x.fillRect(r*0.06,-r*0.40, r*0.10, r*0.13);
      if(cfg.brow){ x.strokeStyle='#16220e'; x.lineWidth=Math.max(2,r*0.13);
        x.beginPath(); x.moveTo(-r*0.46,-r*1.00); x.lineTo(-r*0.06,-r*0.86); x.stroke();
        x.beginPath(); x.moveTo(r*0.46,-r*1.00); x.lineTo(r*0.06,-r*0.86); x.stroke(); }
      if(cfg.hat){ x.fillStyle=cfg.hat; x.strokeStyle=OUT; x.lineWidth=Math.max(2.2,r*0.16);
        x.beginPath(); x.ellipse(0,-r*1.12, r*0.62, r*0.22,0,0,6.283); x.fill(); x.stroke(); }
    }
  });
  return SPR[key];
}
function playerSprite(frame,flash,flip){
  var key='P'+frame+(flash?'f':'')+(flip?'L':''); if(SPR[key]) return SPR[key];
  if(flip){ var pb=playerSprite(frame,flash,0);
    SPR[key]=mk(pb.width,pb.height,function(x){ x.scale(-1,1); x.drawImage(pb,-pb.width/2,-pb.height/2); });
    return SPR[key]; }
  var r=15,pad=r*2.1;
  SPR[key]=mk(pad*2,pad*2,function(x){
    var lean=(frame===0?-1:1);
    x.fillStyle='rgba(0,0,0,0.22)';
    x.beginPath(); x.ellipse(0, r*1.22, r*0.72, r*0.24, 0,0,6.283); x.fill();
    x.lineWidth=3; x.strokeStyle=OUT; x.lineJoin='round';
    x.fillStyle=flash?'#fff':'#3f5ea8';
    [[-r*0.36,lean],[r*0.36,-lean]].forEach(function(L){ x.beginPath();
      x.ellipse(L[0], r*0.88+L[1]*r*0.12, r*0.24, r*0.32,0,0,6.283); x.fill(); x.stroke(); });
    x.fillStyle=flash?'#fff':'#ffd23f';
    x.beginPath(); x.ellipse(0,r*0.22, r*0.66, r*0.72,0,0,6.283); x.fill(); x.stroke();
    x.fillStyle=flash?'#fff':'#f2c49b';
    x.beginPath(); x.ellipse(0,-r*0.60, r*0.56, r*0.54,0,0,6.283); x.fill(); x.stroke();
    if(!flash){
      x.fillStyle='#16220e';
      x.beginPath(); x.arc(-r*0.20,-r*0.62, r*0.09,0,6.283); x.fill();
      x.beginPath(); x.arc(r*0.22,-r*0.62, r*0.09,0,6.283); x.fill();
      x.fillStyle='#c0392b'; x.strokeStyle=OUT; x.lineWidth=3;
      x.beginPath(); x.ellipse(0,-r*1.02, r*0.62, r*0.26,0,0,6.283); x.fill(); x.stroke();
    }
  });
  return SPR[key];
}
function gemSprite(){ if(SPR.G) return SPR.G;
  SPR.G=mk(16,16,function(x){ x.lineWidth=2.4; x.strokeStyle=OUT; x.fillStyle='#8dff5e';
    x.beginPath(); x.moveTo(0,-6); x.lineTo(5,0); x.lineTo(0,6); x.lineTo(-5,0); x.closePath(); x.fill(); x.stroke(); });
  return SPR.G; }
function heartSprite(){ if(SPR.HRT) return SPR.HRT;
  SPR.HRT=mk(22,22,function(x){ x.lineWidth=2.6; x.strokeStyle=OUT; x.fillStyle='#ff5d7a';
    x.beginPath(); x.moveTo(0,6); x.bezierCurveTo(-9,-1,-6,-8,0,-4); x.bezierCurveTo(6,-8,9,-1,0,6); x.closePath(); x.fill(); x.stroke(); });
  return SPR.HRT; }

/* ================= enemy types ================= */
var ZTYPE={
  walker:{r:15, hp:11, spd:40, dmg:8,  xp:1, col:'#7cc043', col2:'#5d9a2f', shirt:'#4a6b8a', score:1},
  runner:{r:12, hp:8,  spd:108, dmg:6,  xp:2, col:'#9fe06a', col2:'#79b84a', shirt:'#8a4a6b', score:2},
  brute: {r:26, hp:85, spd:31, dmg:20, xp:6, col:'#5f9a3c', col2:'#47762c', shirt:'#6b4a2a', brow:1, score:5},
  spitter:{r:14,hp:26, spd:36, dmg:7,  xp:4, col:'#8ab5ff', col2:'#6a92d8', shirt:'#3a4a7a', ranged:1, score:4},
  boss:  {r:46, hp:700,spd:33, dmg:26, xp:60,col:'#b06bd8', col2:'#8b4fb0', shirt:'#3a2a4a', brow:1, hat:'#ff5d7a', score:50}
};

/* ================= upgrades ================= */

function spawnRate(){ return 1.1 + T*0.055 + Math.pow(T/60,1.9)*1.1; }
function pickType(){
  var r=Math.random();
  if(T>140 && r<0.16) return 'spitter';
  if(T>70  && r<0.32) return 'brute';
  if(T>30  && r<Math.min(0.62,0.30+T*0.0012)) return 'runner';
  return 'walker';
}
function spawnZombie(type,dist){
  if(zs.length>140) return null;
  var cfg=ZTYPE[type];
  var a;
  var pv=Math.hypot(P.vx,P.vy);
  if(pv>30 && Math.random()<0.62) a=Math.atan2(P.vy,P.vx)+(Math.random()-0.5)*1.7;
  else a=Math.random()*6.283;
  // spawn just outside the visible rectangle so the horde actually crowds the screen
  var ca=Math.abs(Math.cos(a))||0.0001, sa=Math.abs(Math.sin(a))||0.0001;
  var d=Math.min((W/2+46)/ca,(H/2+46)/sa)+Math.random()*30;
  if(dist) d=dist;
  var late=Math.max(0,(T-120)/60); var hpScale=1+Math.max(0,(T-25))*0.019 + late*late*1.1;
  var z={x:P.x+Math.cos(a)*d, y:P.y+Math.sin(a)*d, t:type, r:cfg.r,
         hp:cfg.hp*hpScale, hpMax:cfg.hp*hpScale, spd:cfg.spd*(0.9+Math.random()*0.25)*(1+T*0.0019),
         flash:0, anim:Math.random()*6, kb:0, kbx:0, kby:0, shootT:1+Math.random()*2, boss:type==='boss'};
  zs.push(z); return z;
}
function spawnBoss(){
  var b=spawnZombie('boss', Math.max(W,H)*0.55);
  if(!b) return;
  var n=Math.floor(T/62);
  b.hp=b.hpMax=(620+n*520);
  bossRef=b; elBoss.style.display='block';
  msg('BIG ONE INCOMING'); SFX.boss(); buzz([60,40,90]); shake=Math.max(shake,16);
}

function nearest(x,y,maxD){
  var best=null,bd=maxD?maxD*maxD:1e12;
  for(var i=0;i<zs.length;i++){ var z=zs[i]; var dx=z.x-x,dy=z.y-y,d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best=z; } }
  return best;
}

}
function damage(z,d,kx,ky,crit){
  z.hp-=d; z.flash=0.09;
  if(kx||ky){ z.kbx=kx; z.kby=ky; z.kb=0.12; }
  if(pops.length<26) pops.push({x:z.x,y:z.y-z.r,txt:''+Math.round(d),life:0.5,max:0.5,c:crit?'#ffe14d':'#ffffff',s:crit?17:13});
  if(z.hp<=0) killZ(z);
  else SFX.hit();
}
function killZ(z){
  var i=zs.indexOf(z); if(i<0) return;
  zs.splice(i,1); kills++; killScore+=ZTYPE[z.t].score;
  SFX.splat();
  var col=ZTYPE[z.t].col;
  var pn=(parts.length>200)?0:(z.boss?40:9);
  for(var n=0;n<pn;n++){
    var a=Math.random()*6.283,s=60+Math.random()*(z.boss?320:180);
    parts.push({x:z.x,y:z.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.4,max:0.8,c:col,r:2+Math.random()*(z.boss?6:3.4)});
  }
  if(splats.length>70) splats.shift();
  splats.push({x:z.x,y:z.y,r:z.r*(z.boss?1.9:0.85),c:'#3f6b2a'});
  var n2=z.boss?26:1;
  for(var g=0;g<n2;g++){
    var ga=Math.random()*6.283, gd=z.boss?Math.random()*70:0;
    gems.push({x:z.x+Math.cos(ga)*gd,y:z.y+Math.sin(ga)*gd,v:ZTYPE[z.t].xp/(z.boss?26:1)*(z.boss?2.4:1),vx:0,vy:0});
  }
  if(z.boss){ bossRef=null; elBoss.style.display='none'; msg('BIG ONE DOWN!'); shake=Math.max(shake,20); buzz(60);
    hearts.push({x:z.x,y:z.y}); hearts.push({x:z.x+30,y:z.y+18}); }
  else if(Math.random()<0.007) hearts.push({x:z.x,y:z.y});
  if(z.boss){ dropPU(z.x+40,z.y); puCd=Math.max(puCd,14); }
  else if(T>18 && puCd<=0 && Math.random()<0.05){
    dropPU(z.x,z.y); puCd=Math.max(11, 26-4*meta('luck')); }
  shake=Math.max(shake, z.boss?18:2.2);
}
function explode(x,y,r,d){
  SFX.boom(); shake=Math.max(shake,7);
  for(var i=zs.length-1;i>=0;i--){ var z=zs[i]; if(!z) continue; var dx=z.x-x,dy=z.y-y;
    if(dx*dx+dy*dy < (r+z.r)*(r+z.r)){ var a=Math.atan2(dy,dx); damage(z,d,Math.cos(a)*220,Math.sin(a)*220,true); } }
  for(var n=0;n<(parts.length>200?0:18);n++){ var a2=Math.random()*6.283,s=80+Math.random()*260;
    parts.push({x:x,y:y,vx:Math.cos(a2)*s,vy:Math.sin(a2)*s,life:0.3+Math.random()*0.35,max:0.65,c:n%2?'#ffd23f':'#ff7b3f',r:2+Math.random()*4}); }
  splats.push({x:x,y:y,r:r*0.5,c:'#3d2a12'});
}
function hurt(d){
  if(P.iframe>0) return;
  d=d*Math.pow(0.88, lvOf('armor'));
  P.hp-=d; P.iframe=0.55; P.slow=0.55; P.flash=0.14; hurtFx=1; shake=Math.max(shake,9);
  SFX.hurt(); buzz(30);
  if(P.hp<=0){
    if(reviveLeft>0){
      reviveLeft--; P.hp=P.hpMax*0.65; P.iframe=2.6; flashWhite=1; shake=Math.max(shake,24);
      msg('SECOND WIND'); SFX.levelup(); buzz([50,40,80]);
      for(var ri=zs.length-1;ri>=0;ri--){ var rz=zs[ri]; if(!rz) continue;
        var rdx=rz.x-P.x, rdy=rz.y-P.y;
        if(rdx*rdx+rdy*rdy < 210*210){ var ra=Math.atan2(rdy,rdx);
          damage(rz, 200*dmgMul(), Math.cos(ra)*420, Math.sin(ra)*420, true); } }
      syncHud(); return;
    }
    P.hp=0; die(); }
}

function dropPU(x,y){
  var keys=['nuke','magnet','saw'];
  pus.push({x:x,y:y,t:keys[Math.floor(Math.random()*keys.length)],bob:Math.random()*6.283});
}
function grabPU(k){
  var cfg=PU[k];
  buzz([25,20,45]);
  if(k==='nuke'){
    msg('NUKE!'); flashWhite=1; shake=Math.max(shake,26); SFX.boom(); SFX.boss();
    for(var i=zs.length-1;i>=0;i--){ var z=zs[i]; if(!z) continue;
      if(Math.abs(z.x-P.x)<W*1.1 && Math.abs(z.y-P.y)<H*1.1){
        if(z.boss) damage(z, 420*dmgMul(), 0,0,true); else killZ(z); } }
    return;
  }
  pu={type:k, t:cfg.dur, max:cfg.dur};
  msg(cfg.name); SFX.levelup();
  if(k==='saw'){ shake=Math.max(shake,8); }
}
function stepPU(dt){
  if(puCd>0) puCd-=dt;
  for(var i=pus.length-1;i>=0;i--){
    var o=pus[i], dx=P.x-o.x, dy=P.y-o.y, d=Math.hypot(dx,dy)||1;
    if(d<gemPull*1.2){ o.x+=dx/d*200*dt; o.y+=dy/d*200*dt; }
    if(d<P.r+16){ pus.splice(i,1); grabPU(o.t); }
  }
  if(pu){
    pu.t-=dt;
    if(pu.type==='saw'){
      sawA+=dt*13; sawTick-=dt;
      if(sawTick<=0){ sawTick=0.12; SFX.swing();
        for(var zi=zs.length-1;zi>=0;zi--){ var z=zs[zi]; if(!z) continue;
          var ddx=z.x-P.x, ddy=z.y-P.y, rr=z.r+62;
          if(ddx*ddx+ddy*ddy<rr*rr){ var a=Math.atan2(ddy,ddx);
            damage(z, 26*dmgMul(), Math.cos(a)*260, Math.sin(a)*260, true); } } }
    }
    if(pu.t<=0){ pu=null; elPu.style.display='none'; }
    else { elPu.style.display='block'; elPuName.textContent=PU[pu.type].name+'  '+pu.t.toFixed(1)+'s';
           elPuFill.style.width=(pu.t/pu.max*100)+'%'; }
  }
}

/* ================= level up ================= */
function gainXp(v){
  xp+=v;
  while(xp>=xpNeed){ xp-=xpNeed; level++; xpNeed=Math.round(5+level*3.4+level*level*0.28); openLevelUp(); }
}
function openLevelUp(){
  if(state===ST.dead) return;
  state=ST.levelup; SFX.levelup();
  var pool=UP.filter(function(u){ return lvOf(u.id)<u.max; });
  var pick=[];
  for(var i=0;i<3 && pool.length;i++){ var j=Math.floor(Math.random()*pool.length); pick.push(pool[j]); pool.splice(j,1); }
  elCards.innerHTML='';
  pick.forEach(function(u){
    var l=lvOf(u.id);
    var d=document.createElement('div'); d.className='card';
    d.innerHTML='<div class="cico">'+u.ico+'</div><div><div class="cname">'+u.name+'</div>'+
      '<div class="cdesc">'+u.desc(l)+'</div><div class="clvl">'+(l? 'LEVEL '+(l+1) : 'NEW')+'</div></div>';
    d.addEventListener('click',function(e){ e.stopPropagation(); takeUpgrade(u.id); });
    d.addEventListener('touchstart',function(e){ e.stopPropagation(); },{passive:true});
    elCards.appendChild(d);
  });
  elLvl.classList.add('on');
}
function takeUpgrade(id){
  lv[id]=lvOf(id)+1;
  if(pendingLevels>0){ pendingLevels--; level++;
    if(id==='hp'){ P.hpMax+=25; P.hp=Math.min(P.hpMax,P.hp+25); }
    if(id==='magnet') gemPull=64+meta('vac')*48+lvOf('magnet')*55;
    elLvl.classList.remove('on'); setTimeout(openLevelUp,10); syncHud(); return; }
  if(id==='hp'){ P.hpMax+=25; P.hp=Math.min(P.hpMax,P.hp+25); }
  if(id==='magnet') gemPull=64+meta('vac')*48+lvOf('magnet')*55;
  elLvl.classList.remove('on');
  state=ST.play; syncHud();
}
/* ================= death ================= */
function die(){
  if(state===ST.dead) return;
  state=ST.dead; freeze=0.25; shake=20; SFX.die(); buzz([70,50,140]);
  for(var n=0;n<30;n++){ var a=Math.random()*6.283,s=70+Math.random()*230;
    parts.push({x:P.x,y:P.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.5+Math.random()*0.5,max:1,c:n%3?'#ffd23f':'#ff5d5d',r:2+Math.random()*4}); }
  earnedBrains=brainsFor(kills,T,level);
  save.brains=(save.brains||0)+earnedBrains;
  save.runs++; save.totalKills+=kills;
  var rec=false;
  if(T>save.bestTime){ save.bestTime=T; rec=true; }
  if(kills>save.bestKills) save.bestKills=kills;
  persist();
  setTimeout(function(){ showOver(rec); }, 620);
}

  }
  // entities sorted by y
  var ents=zs.slice(); ents.push(P);
  ents.sort(function(a,b){ return a.y-b.y; });
  for(var e=0;e<ents.length;e++){
    var z=ents[e];
    if(z===P){
      if(state===ST.dead) continue;
      var ps=playerSprite(P.frame, P.flash>0?1:0, P.face<0?1:0), pw=ps.width;
      if(P.iframe>0 && Math.floor(P.iframe*18)%2) ctx.globalAlpha=0.45;
      ctx.drawImage(ps,P.x-pw/2,P.y-pw/2); ctx.globalAlpha=1;
      if(P.aim!=null){
        var gx=P.x+Math.cos(P.aim)*15, gy=P.y+Math.sin(P.aim)*4+2;
        ctx.save(); ctx.translate(gx,gy); ctx.rotate(Math.cos(P.aim)<0?Math.PI:0);
        ctx.fillStyle='#4a4f57'; ctx.strokeStyle=OUT; ctx.lineWidth=2.4;
        ctx.beginPath(); ctx.rect(-2,-3,13,6); ctx.fill(); ctx.stroke(); ctx.restore();
        if(P.muzzle>0){ ctx.fillStyle='rgba(255,224,90,'+Math.min(1,P.muzzle*9)+')';
          ctx.beginPath(); ctx.arc(gx+Math.cos(P.aim)*13, gy+Math.sin(P.aim)*6, 7*Math.min(1,P.muzzle*9),0,6.283); ctx.fill(); }
      }
      // gun
      continue;
    }
    var fr=(Math.floor(z.anim)%2), spr=zombieSprite(z.t,fr, z.flash>0?1:0, z.x>P.x?1:0), w2=spr.width;
    ctx.drawImage(spr, z.x-w2/2, z.y-w2/2 - Math.abs(Math.sin(z.anim*3.14))*2);
    if(z.boss){
      ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(z.x-38,z.y-z.r*1.9,76,7);
      ctx.fillStyle='#ff4d8d'; ctx.fillRect(z.x-38,z.y-z.r*1.9,76*Math.max(0,z.hp/z.hpMax),7);
    }
  }
  // bullets
  for(var b=0;b<bs.length;b++){ var bb=bs[b];
    ctx.fillStyle=bb.col; ctx.strokeStyle=OUT; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(bb.x,bb.y,bb.r,0,6.283); ctx.fill(); ctx.stroke(); }
  // particles
  for(var p=0;p<parts.length;p++){ var o=parts[p], al=Math.max(0,o.life/o.max);
    if(o.bolt){ ctx.strokeStyle='rgba(200,245,255,'+al+')'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(o.x1,o.y1); ctx.lineTo(o.x2,o.y2); ctx.stroke(); continue; }
    ctx.globalAlpha=al; ctx.fillStyle=o.c;
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r*(0.5+al*0.6),0,6.283); ctx.fill(); }
  ctx.globalAlpha=1;
  // damage numbers
  ctx.textAlign='center';
  for(var u=0;u<pops.length;u++){ var q=pops[u], qa=Math.max(0,q.life/q.max);
    ctx.globalAlpha=qa; ctx.font='900 '+q.s+'px -apple-system,Arial,sans-serif';
    ctx.lineWidth=3.5; ctx.strokeStyle='#16220e'; ctx.strokeText(q.txt,q.x,q.y);
    ctx.fillStyle=q.c; ctx.fillText(q.txt,q.x,q.y); }
  ctx.globalAlpha=1; ctx.textAlign='left';
  ctx.restore();

  // joystick
  if(touch.on && state===ST.play){
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(touch.ox,touch.oy,52,0,6.283); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.22)';
    var jx=touch.x-touch.ox, jy=touch.y-touch.oy, jd=Math.hypot(jx,jy);
    if(jd>52){ jx=jx/jd*52; jy=jy/jd*52; }
    ctx.beginPath(); ctx.arc(touch.ox+jx,touch.oy+jy,22,0,6.283); ctx.fill();
  }
  if(flashWhite>0.01){ ctx.fillStyle='rgba(255,255,255,'+Math.min(0.85,flashWhite)+')'; ctx.fillRect(0,0,W,H); }
  // hurt vignette
  if(hurtFx>0.01){
    var gr=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.28,W/2,H/2,Math.max(W,H)*0.62);
    gr.addColorStop(0,'rgba(255,0,0,0)'); gr.addColorStop(1,'rgba(255,0,0,'+Math.min(0.6,hurtFx*0.6)+')');
    ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  }
}
/* ================= loop ================= */
var last=performance.now(), acc=0, STEP=1/60, paused=false, fpsS=[];
function frame(now){
  var dt=(now-last)/1000; last=now;
  if(dt>0.1) dt=0.1;
  fpsS.push(dt); if(fpsS.length>60) fpsS.shift();
  if(paused){ requestAnimationFrame(frame); return; }
  if(freeze>0) freeze-=dt;
  else { acc+=dt*timeScale; var guard=0; while(acc>=STEP && guard++<5){ update(STEP); acc-=STEP; } }
  draw();
  requestAnimationFrame(frame);
}
resize();
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,150); });
resetRun(); buildShop(); syncMenu();
for(var mi2=0;mi2<7;mi2++) spawnZombie('walker', 120+Math.random()*260);
requestAnimationFrame(frame);

/* ================= test surface ================= */
window.GAME={
  info:function(){ return {state:state,time:+T.toFixed(1),kills:kills,level:level,hp:Math.round(P.hp),hpMax:P.hpMax,
    zombies:zs.length,bullets:bs.length,gems:gems.length,parts:parts.length,best:save.bestTime,lv:JSON.parse(JSON.stringify(lv)),
    fps:fpsS.length?Math.round(1/(fpsS.reduce(function(a,b){return a+b},0)/fpsS.length)):0}; },
  start:startRun, step:function(dt){ update(dt); }, draw:draw,
  pause:function(v){ paused=!!v; last=performance.now(); acc=0; },
  isDead:function(){ return state===ST.dead; },
  isLevelUp:function(){ return state===ST.levelup; },
  pick:function(i){ var c=elCards.children[i||0]; if(c) c.click(); },
  moveTo:function(dx,dy){ touch.on=true; touch.ox=0; touch.oy=0; touch.x=dx*52; touch.y=dy*52; },
  stopMove:function(){ touch.on=false; },
  player:function(){ return {x:P.x,y:P.y,hp:P.hp,r:P.r}; },
  zombies:function(){ return zs.map(function(z){ return {x:z.x,y:z.y,r:z.r,t:z.t,hp:z.hp}; }); },
  gems:function(){ return gems.map(function(g){ return {x:g.x,y:g.y}; }); },
  mute:function(){ A.on=false; if(A.master&&A.ctx) A.master.gain.value=0; },
  cost:function(n){ n=n||120; var a=performance.now(); for(var i=0;i<n;i++){ update(1/60); draw(); } return +((performance.now()-a)/n).toFixed(3); },
  save:function(){ return JSON.parse(JSON.stringify(save)); },
  setTime:function(v){ T=v; },
  pus:function(){ return pus.map(function(o){ return {x:o.x,y:o.y,t:o.t}; }); },
  pu:function(){ return pu?{type:pu.type,t:+pu.t.toFixed(2)}:null; },
  dropPU:function(x,y){ dropPU(P.x+(x||30),P.y+(y||0)); },
  grabPU:function(k){ grabPU(k); },
  brains:function(){ return save.brains||0; },
  addBrains:function(n){ save.brains=(save.brains||0)+n; persist(); buildShop(); syncMenu(); },
  buy:function(id){ var rows=elShop.children, i=0;
    for(;i<META.length;i++) if(META[i].id===id) break;
    if(rows[i]) rows[i].click(); return meta(id); },
  meta:function(){ return JSON.parse(JSON.stringify(save.meta)); },
  toMenu:toMenu,
  earned:function(){ return earnedBrains; },
  revive:function(){ return reviveLeft; },
  wipe:function(){ save={bestTime:0,bestKills:0,runs:0,totalKills:0,mute:0,brains:0,meta:{}}; persist(); buildShop(); syncMenu(); },
  W:function(){return W;}, H:function(){return H;}
};
})();
</script>
