<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inside Cortex</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0d10;
    color: #e8e6df;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }
  h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 28px;
  }
  .player {
    width: min(1080px, 100%);
  }
  video {
    width: 100%;
    display: block;
    border-radius: 12px;
    background: #000;
    box-shadow: 0 24px 80px rgba(0,0,0,0.55);
  }
</style>
</head>
<body>
  <h1>Inside Cortex</h1>
  <div class="player">
    <video controls playsinline preload="metadata" src="inside_cortex.mp4"></video>
  </div>
</body>
</html>
