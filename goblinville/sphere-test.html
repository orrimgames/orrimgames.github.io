<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SPHERE TEST</title>
<style>
  html,body{margin:0;padding:0;background:#0a1830;height:100%;overflow:hidden}
  #c{display:block;width:100vw;height:100vh;touch-action:none}
  #hud{position:fixed;top:12px;left:12px;color:#9fd;font:14px monospace;pointer-events:none;text-shadow:0 1px 2px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">drag = spin | pinch = zoom<br>a sphere. nothing else.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const cv=document.getElementById('c');
const r=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const sc=new THREE.Scene();
sc.background=new THREE.Color(0x0a1830);
const cam=new THREE.PerspectiveCamera(45,1,0.1,1000);
let az=0.6, el=0.35, dist=4.2;
function resize(){r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio||1,3));cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
// the sphere. nothing else.
const ball=new THREE.Mesh(
  new THREE.SphereGeometry(1,96,64),
  new THREE.MeshStandardMaterial({color:0x3a7bd5,roughness:0.85,metalness:0.0,flatShading:false}));
sc.add(ball);
sc.add(new THREE.Mesh(new THREE.SphereGeometry(1.002,96,64),
  new THREE.MeshStandardMaterial({color:0x7ecbff,wireframe:true,transparent:true,opacity:0.18})));
sc.add(new THREE.DirectionalLight(0xffffff,1.0).position.set(1,0.6,0.8).clone());
const sun=new THREE.DirectionalLight(0xfff2df,1.2);sun.position.set(3,2,4);sc.add(sun);
sc.add(new THREE.AmbientLight(0x334455,0.9));
const star=new THREE.PointLight(0x88aaff,0.4);star.position.set(-4,-2,-3);sc.add(star);
// input
const t={};
function d2(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);t[e.pointerId]={x:e.clientX,y:e.clientY};});
cv.addEventListener('pointermove',e=>{
  if(!t[e.pointerId])return;
  const ids=Object.keys(t);
  if(ids.length>=2){
    const a=ids[0],b=ids[1];
    const before={clientX:t[a].x,clientY:t[a].y}, after={clientX:t[b].x,clientY:t[b].y};
    const prev=d2(before,after);
    t[e.pointerId]={x:e.clientX,y:e.clientY};
    const now=d2({clientX:t[a].x,clientY:t[a].y},{clientX:t[b].x,clientY:t[b].y});
    if(prev>0)dist=THREE.MathUtils.clamp(dist*prev/now,1.5,20);
  }else{
    az+=(e.clientX-t[e.pointerId].x)*0.008;
    el=THREE.MathUtils.clamp(el+(e.clientY-t[e.pointerId].y)*0.008,-1.4,1.4);
    t[e.pointerId]={x:e.clientX,y:e.clientY};
  }});
cv.addEventListener('pointerup',e=>{delete t[e.pointerId];});
cv.addEventListener('pointercancel',e=>{delete t[e.pointerId];});
cv.addEventListener('wheel',e=>{dist=THREE.MathUtils.clamp(dist*(1+e.deltaY*0.001),1.5,20);});
function loop(){
  cam.position.set(Math.cos(el)*Math.sin(az)*dist,Math.sin(el)*dist,Math.cos(el)*Math.cos(az)*dist);
  cam.lookAt(0,0,0);
  r.render(sc,cam);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
